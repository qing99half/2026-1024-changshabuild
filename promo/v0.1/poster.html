<!doctype html>

<head>

  <title>Righty Tighty 99 · v0.1 宣传海报</title>
  <style>
    * { box-sizing: border-box; }

    .topline { position: absolute; top: 63px; left: 64px; right: 64px; display: flex; align-items: center;

      filter: drop-shadow(7px 9px 4px #0009); }

      font-weight: 900; letter-spacing: .015em; }

      box-shadow: 0 28px 55px #0008, 8px 8px 0 #b84f473b; }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .hero::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 55px #0005; pointer-events: none; }
    .caption { position: absolute; right: 17px; bottom: 17px; padding: 7px 12px;

<body>
  <article class="poster" aria-label="Righty Tighty 99 宣传海报">

    </section>
    <div class="footer"><span>RIGHTY TIGHTY 99</span><span>网页游戏 · 横屏体验</span></div>
  </article>
